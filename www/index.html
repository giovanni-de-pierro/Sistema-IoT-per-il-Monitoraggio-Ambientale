<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoraggio IoT Cosmos DB</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; line-height: 1.6; background-color: #f0f2f5;
        }
        .card { 
            background: white; padding: 25px; border-radius: 12px; 
            max-width: 1100px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { color: #1a73e8; margin-top: 0; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        select { 
            padding: 12px; margin: 10px 0; width: 100%; 
            border-radius: 8px; border: 1px solid #ccc; font-size: 16px;
            cursor: pointer;
        }
        
        .charts-row {
            display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; display: none; 
        }
        .chart-wrapper {
            flex: 1; min-width: 45%; background: #fff; padding: 15px;
            border-radius: 8px; border-top: 4px solid #1a73e8;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
        }
        canvas { width: 100% !important; height: 320px !important; }
        
        #result { 
            margin-top: 20px; background: #e8f0fe; padding: 20px; 
            border-radius: 8px; display: none; border-left: 5px solid #1a73e8;
        }
        .stat-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;
        }
        .stat-item { font-size: 0.95em; color: #333; }
        .stat-item strong { color: #1a73e8; display: block; margin-bottom: 4px; font-size: 1.1em; }
        .anomaly-badge { font-weight: bold; padding: 2px 6px; border-radius: 4px; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h2>IoT Device Monitor</h2>
        
        <label for="deviceList">Seleziona Dispositivo:</label>
        <select id="deviceList" onchange="handleDeviceChange()">
            <option value="">Caricamento...</option>
        </select>

        <div id="result"></div>

        <div id="chartsContainer" class="charts-row">
            <div class="chart-wrapper">
                <canvas id="tempChart"></canvas>
            </div>
            <div class="chart-wrapper">
                <canvas id="humChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let chartTemp = null;
        let chartHum = null;
        let rawHistoryData = []; 

        // Plugin per le linee di soglia orizzontali
        const horizontalLinePlugin = {
            id: 'horizontalLine',
            afterDraw: (chart, args, options) => {
                const { ctx, chartArea: { left, right }, scales: { y } } = chart;
                if (!options.lines) return;

                ctx.save();
                options.lines.forEach(line => {
                    const yPos = y.getPixelForValue(line.value);
                    if (yPos < chart.chartArea.top || yPos > chart.chartArea.bottom) return;

                    ctx.strokeStyle = line.color;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);
                    ctx.beginPath();
                    ctx.moveTo(left, yPos);
                    ctx.lineTo(right, yPos);
                    ctx.stroke();

                    ctx.fillStyle = line.color;
                    ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'left';
                    ctx.fillText(line.label, left + 8, yPos - 6);
                });
                ctx.restore();
            }
        };

        async function loadDevices() {
            const select = document.getElementById('deviceList');
            try {
                const res = await fetch('/api/GetDevices');
                const devices = await res.json();
                if (!devices.length) { 
                    select.innerHTML = '<option value="">Nessun device</option>'; 
                    return; 
                }
                select.innerHTML = '<option value="">-- Seleziona un dispositivo --</option>' + 
                                  devices.map(id => `<option value="${id}">${id}</option>`).join('');
            } catch (err) { select.innerHTML = '<option value="">Errore caricamento</option>'; }
        }

        function handleDeviceChange() {
            const deviceId = document.getElementById('deviceList').value;
            if (deviceId) {
                // Carichiamo prima la storia per calcolare statistiche precise e poi i grafici
                getChartData();
            } else {
                document.getElementById('result').style.display = 'none';
                document.getElementById('chartsContainer').style.display = 'none';
            }
        }

        async function getChartData() {
            const deviceId = document.getElementById('deviceList').value;
            try {
                const res = await fetch(`/api/GetDeviceHistory?deviceId=${deviceId}`);
                rawHistoryData = await res.json();
                
                // Una volta ottenuti i dati, aggiorniamo statistiche e grafici
                updateStatsUI();
                createCharts();
                document.getElementById('chartsContainer').style.display = 'flex';
            } catch (err) { alert("Errore nel recupero dei dati storici."); }
        }

        function updateStatsUI() {
            if (rawHistoryData.length === 0) return;

            const resDiv = document.getElementById('result');
            resDiv.style.display = 'block';

            // Calcolo statistiche estese
            const temps = rawHistoryData.map(d => d.temperature);
            const hums = rawHistoryData.map(d => d.humidity);
            
            const maxT = Math.max(...temps).toFixed(1);
            const minT = Math.min(...temps).toFixed(1);
            const avgT = (temps.reduce((a, b) => a + b, 0) / temps.length).toFixed(1);

            const maxH = Math.max(...hums).toFixed(1);
            const minH = Math.min(...hums).toFixed(1);
            const avgH = (hums.reduce((a, b) => a + b, 0) / hums.length).toFixed(1);

            const tempAnomalies = temps.filter(t => t < 18 || t > 26).length;
            const humAnomalies = hums.filter(h => h < 30 || h > 60).length;

            resDiv.innerHTML = `
                <div class="stat-grid">
                    <div class="stat-item">
                        <strong>Temperatura</strong>
                        Media: ${avgT}°C <br>
                        <small>Min: ${minT}°C / Max: ${maxT}°C</small>
                    </div>
                    <div class="stat-item">
                        <strong>Umidità</strong>
                        Media: ${avgH}% <br>
                        <small>Min: ${minH}% / Max: ${maxH}%</small>
                    </div>
                    <div class="stat-item">
                        <strong>Anomalie (Fuori Soglia)</strong>
                        <span style="color: #8b0000">Temp: ${tempAnomalies}</span><br>
                        <span style="color: #00008b">Umidità: ${humAnomalies}</span>
                    </div>
                    <div class="stat-item">
                        <strong>Info Sessione</strong>
                        Messaggi: ${rawHistoryData.length}<br>
                        Ultimo: ${new Date(rawHistoryData[0].timestamp).toLocaleTimeString()}
                    </div>
                </div>
            `;
        }

        function createCharts() {
            const labels = rawHistoryData.map(d => new Date(d.timestamp).toLocaleTimeString());
            const temps = rawHistoryData.map(d => d.temperature);
            const hums = rawHistoryData.map(d => d.humidity);

            if (chartTemp) chartTemp.destroy();
            if (chartHum) chartHum.destroy();

            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: true, position: 'top' } },
                scales: { x: { display: false } }
            };

            // Grafico Temperatura
            chartTemp = new Chart(document.getElementById('tempChart'), {
                type: 'line',
                plugins: [horizontalLinePlugin],
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Temperatura (°C)',
                        data: temps,
                        borderColor: '#ff6384',
                        backgroundColor: '#ff638411',
                        fill: true,
                        pointBackgroundColor: temps.map(t => (t < 18 || t > 26) ? '#8b0000' : '#ff6384'),
                        pointRadius: temps.map(t => (t < 18 || t > 26) ? 7 : 3),
                        tension: 0.3
                    }]
                },
                options: {
                    ...commonOptions,
                    plugins: {
                        ...commonOptions.plugins,
                        horizontalLine: {
                            lines: [
                                { value: 18, color: '#8b0000', label: 'MIN LIMITE 18°C' },
                                { value: 26, color: '#8b0000', label: 'MAX LIMITE 26°C' }
                            ]
                        }
                    }
                }
            });

            // Grafico Umidità
            chartHum = new Chart(document.getElementById('humChart'), {
                type: 'line',
                plugins: [horizontalLinePlugin],
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Umidità (%)',
                        data: hums,
                        borderColor: '#36a2eb',
                        backgroundColor: '#36a2eb11',
                        fill: true,
                        pointBackgroundColor: hums.map(h => (h < 30 || h > 60) ? '#00008b' : '#36a2eb'),
                        pointRadius: hums.map(h => (h < 30 || h > 60) ? 7 : 3),
                        tension: 0.3
                    }]
                },
                options: {
                    ...commonOptions,
                    plugins: {
                        ...commonOptions.plugins,
                        horizontalLine: {
                            lines: [
                                { value: 30, color: '#00008b', label: 'MIN LIMITE 30%' },
                                { value: 60, color: '#00008b', label: 'MAX LIMITE 60%' }
                            ]
                        }
                    }
                }
            });
        }

        loadDevices();
    </script>
</body>
</html>
